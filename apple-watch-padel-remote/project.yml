name: PadelScore
options:
  bundleIdPrefix: com.scorerecord
  deploymentTarget:
    iOS: "16.0"
    watchOS: "9.0"
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  PadelCompanion:
    type: application
    platform: iOS
    sources: [PadelCompanion]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scorerecord.padelcompanion
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Padel Score
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGNING_ALLOWED: NO
  PadelWatch:
    type: application
    platform: watchOS
    sources: [PadelWatch]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scorerecord.padelcompanion.watchkitapp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Padel Score
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.scorerecord.padelcompanion
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: NO
