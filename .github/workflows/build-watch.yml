name: Build Apple Watch app
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: apple-watch-padel-remote
        run: xcodegen generate

      - name: Build Watch app
        working-directory: apple-watch-padel-remote
        run: |
          set -o pipefail
          xcodebuild -project PadelScore.xcodeproj -scheme PadelWatch \
            -sdk watchos -configuration Release -destination 'generic/platform=watchOS' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -n 25

      - name: Build iPhone companion app
        working-directory: apple-watch-padel-remote
        run: |
          set -o pipefail
          xcodebuild -project PadelScore.xcodeproj -scheme PadelCompanion \
            -sdk iphoneos -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -n 25

      - name: Package IPA for Sideloadly
        working-directory: apple-watch-padel-remote
        run: |
          mkdir -p build/Payload
          
          # Find and copy iPhone app
          IPHONE_APP=$(find build/dd/Build/Products -name "PadelCompanion.app" | head -n 1)
          echo "iPhone App: $IPHONE_APP"
          cp -R "$IPHONE_APP" build/Payload/
          
          # Find and copy Watch app into Watch subfolder
          mkdir -p build/Payload/PadelCompanion.app/Watch
          WATCH_APP=$(find build/dd/Build/Products -name "PadelWatch.app" | head -n 1)
          echo "Watch App: $WATCH_APP"
          if [ -n "$WATCH_APP" ]; then
            cp -R "$WATCH_APP" build/Payload/PadelCompanion.app/Watch/
          fi
          
          # Verify files exist
          ls -la build/Payload/PadelCompanion.app
          
          cd build && zip -qr PadelScore.ipa Payload
          ls -lh PadelScore.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PadelScore-IPA
          path: apple-watch-padel-remote/build/PadelScore.ipa
