name: Build Apple Watch app
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: apple-watch-padel-remote
        run: xcodegen generate

      - name: Build Watch app (real hardware)
        working-directory: apple-watch-padel-remote
        run: |
          xcodebuild -project PadelScore.xcodeproj -scheme PadelWatch \
            -sdk watchos -destination 'generic/platform=watchOS' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -n 25

      - name: Build iPhone companion app (real hardware)
        working-directory: apple-watch-padel-remote
        run: |
          xcodebuild -project PadelScore.xcodeproj -scheme PadelCompanion \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -n 25

      - name: Package IPA for Sideloadly
        working-directory: apple-watch-padel-remote
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build/dd/Build/Products -maxdepth 3 -name "PadelCompanion.app" | head -n 1)
          echo "Found companion app at: $APP_PATH"
          cp -r "$APP_PATH" build/Payload/
          
          mkdir -p build/Payload/PadelCompanion.app/Watch
          WATCH_PATH=$(find build/dd/Build/Products -maxdepth 3 -name "PadelWatch.app" | head -n 1)
          echo "Found watch app at: $WATCH_PATH"
          if [ -n "$WATCH_PATH" ]; then
            cp -r "$WATCH_PATH" build/Payload/PadelCompanion.app/Watch/
          fi
          
          cd build && zip -qr PadelScore.ipa Payload
          ls -lh PadelScore.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PadelScore-IPA
          path: apple-watch-padel-remote/build/PadelScore.ipa
