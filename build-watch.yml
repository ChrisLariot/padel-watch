name: Build Apple Watch app
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: apple-watch-padel-remote
        run: xcodegen generate

      - name: Build iPhone app with Watch app inside (real devices)
        working-directory: apple-watch-padel-remote
        run: |
          xcodebuild -project PadelScore.xcodeproj -scheme PadelCompanion \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -n 40

      - name: Package IPA for Sideloadly
        working-directory: apple-watch-padel-remote
        run: |
          mkdir -p build/Payload
          cp -r build/dd/Build/Products/Release-iphoneos/PadelCompanion.app build/Payload/ 2>/dev/null || \
          cp -r build/dd/Build/Products/Debug-iphoneos/PadelCompanion.app build/Payload/
          ls build/Payload/PadelCompanion.app/Watch
          cd build && zip -qr PadelScore.ipa Payload && ls -lh PadelScore.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PadelScore-IPA
          path: apple-watch-padel-remote/build/PadelScore.ipa

